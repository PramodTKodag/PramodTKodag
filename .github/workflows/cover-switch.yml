name: Day/night cover

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST → day cover
    - cron: "30 13 * * *" # 19:00 IST → night cover
  workflow_dispatch:

jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swap cover for time of day in IST
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 19 ]; then
            SRC=assets/cover-day.webp
          else
            SRC=assets/cover-night.webp
          fi
          cp "$SRC" assets/cover.webp
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/cover.webp
            git commit -m "Swap cover to $(basename "$SRC" .webp | cut -d- -f2) mode"
            git push
          fi
